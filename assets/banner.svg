<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #FFFFFF;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #C7D2FE;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #E0E7FF;
    }
    .node-label {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #94A3B8;
    }
    
    /* Subtle Animations for Background Dynamic Graphics */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatParticle1 {
      0% { transform: translate(0, 0); }
      50% { transform: translate(15px, -15px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes floatParticle2 {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-20px, 10px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    
    .animated-bg-glow {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .particle-1 { animation: floatParticle1 7s ease-in-out infinite; }
    .particle-2 { animation: floatParticle2 9s ease-in-out infinite; }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashMove 3s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern overlay -->
  <g opacity="0.08">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200 M0 320H1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M100 0V360 M200 0V360 M300 0V360 M400 0V360 M500 0V360 M600 0V360 M700 0V360 M800 0V360 M900 0V360 M1000 0V360 M1100 0V360" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Background Dynamic Center Radial Glow -->
  <circle cx="600" cy="180" r="300" fill="url(#centerGlow)" class="animated-bg-glow" />

  <!-- DYNAMIC BACKGROUND GRAPHICS (Decorative Pub/Sub Network Nodes & Flow Lines) -->
  <!-- Low Opacity Behind Text -->
  <g opacity="0.45" class="particle-1">
    <!-- Left Publisher Node -->
    <circle cx="120" cy="180" r="36" fill="#1E293B" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="120" cy="180" r="12" fill="#818CF8" />
    <text x="120" y="232" text-anchor="middle" class="node-label">PUBLISHER</text>

    <!-- Flow Lines to Broker -->
    <path d="M156 180 C 260 180, 260 180, 340 180" stroke="#818CF8" stroke-width="2" fill="none" class="flow-line"/>
  </g>

  <g opacity="0.45" class="particle-2">
    <!-- Right Subscriber Nodes -->
    <!-- Node A: Web Push -->
    <circle cx="1080" cy="90" r="28" fill="#1E293B" stroke="#EC4899" stroke-width="2" filter="url(#shadow)"/>
    <path d="M1070 90 L1090 90 M1080 80 L1080 100" stroke="#F472B6" stroke-width="2"/>
    <text x="1080" y="132" text-anchor="middle" class="node-label">WEB PUSH</text>

    <!-- Node B: Mobile Push -->
    <circle cx="1080" cy="180" r="28" fill="#1E293B" stroke="#38BDF8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1074" y="170" width="12" height="20" rx="2" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <text x="1080" y="222" text-anchor="middle" class="node-label">MOBILE</text>

    <!-- Node C: Webhook / Email -->
    <circle cx="1080" cy="270" r="28" fill="#1E293B" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <polyline points="1070,264 1080,274 1090,264" fill="none" stroke="#34D399" stroke-width="2"/>
    <text x="1080" y="312" text-anchor="middle" class="node-label">WEBHOOK</text>

    <!-- Flow Lines from Broker to Subscribers -->
    <path d="M860 180 C 950 180, 960 90, 1052 90" stroke="#F472B6" stroke-width="2" fill="none" class="flow-line"/>
    <path d="M860 180 C 950 180, 960 180, 1052 180" stroke="#38BDF8" stroke-width="2" fill="none" class="flow-line"/>
    <path d="M860 180 C 950 180, 960 270, 1052 270" stroke="#34D399" stroke-width="2" fill="none" class="flow-line"/>
  </g>

  <!-- Central Message Broker Ring (Background Decor) -->
  <g opacity="0.25">
    <circle cx="600" cy="180" r="140" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="12 8"/>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, & Feature Pills -->
  <!-- 1. Top Category Pill Badge -->
  <g transform="translate(600, 52)" filter="url(#shadow)">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="-148" cy="0" r="5" fill="#10B981"/>
    <text x="-132" y="5" class="badge-text" letter-spacing="0.5">REAL-TIME MESSAGING &amp; NOTIFICATIONS</text>
  </g>

  <!-- 2. Main Title (Crisp, High Contrast Foreground) -->
  <g filter="url(#shadow)">
    <text x="600" y="138" text-anchor="middle" class="title">Awesome Pub/Sub &amp; Push Notifications</text>
  </g>

  <!-- 3. Subtitle -->
  <g filter="url(#shadow)">
    <text x="600" y="178" text-anchor="middle" class="subtitle">Curated Ecosystem of Open-Source Engines, Libraries &amp; SaaS Platforms</text>
  </g>

  <!-- 4. Feature Pills Grid (Foreground Details) -->
  <g transform="translate(600, 240)">
    <!-- Pill 1: Infrastructure -->
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1E293B" stroke="#4F46E5" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="badge-text">⚡ Pub/Sub Brokers</text>
    </g>

    <!-- Pill 2: Push Engines -->
    <g transform="translate(-110, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="badge-text">🔔 Push Notification APIs</text>
    </g>

    <!-- Pill 3: Self-Hosted -->
    <g transform="translate(105, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="badge-text">🛠️ Self-Hosted Engines</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(305, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="badge-text">🌟 100% Curated</text>
    </g>
  </g>

  <!-- 5. Footer Line Decor -->
  <rect x="350" y="306" width="500" height="3" rx="1.5" fill="url(#primaryGrad)" opacity="0.8"/>
</svg>
