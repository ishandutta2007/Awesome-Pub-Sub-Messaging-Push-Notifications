<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0F172A"/><stop offset="50%" stop-color="#1E1B4B"/><stop offset="100%" stop-color="#0F172A"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366F1"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38BDF8" stop-opacity=".8"/><stop offset="100%" stop-color="#818CF8" stop-opacity=".2"/></linearGradient><radialGradient id="centerGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4F46E5" stop-opacity=".35"/><stop offset="100%" stop-color="#0F172A" stop-opacity="0"/></radialGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".6" stdDeviation="6"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes floatParticle1{0%{transform:translate(0,0)}50%{transform:translate(15px,-15px)}}@keyframes floatParticle2{0%{transform:translate(0,0)}50%{transform:translate(-20px,10px)}}@keyframes dashMove{0%{stroke-dashoffset:40}}.badge-text,.node-label,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#c7d2fe}.badge-text,.node-label{font-weight:600;font-size:13px;fill:#e0e7ff}.node-label{font-size:12px;fill:#94a3b8}.animated-bg-glow{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}